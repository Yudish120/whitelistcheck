name: Build olcRTC Transport Test IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize gomobile
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Build olcRTC iOS framework
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash scripts/build_olcrtc_ios.sh

      - name: Apply fixed iOS source files
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_ios_fix.py

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build Payload WhiteListTransportTest-unsigned.ipa build.log

          xcodebuild \
            -project WhiteListTransportTest.xcodeproj \
            -scheme WhiteListTransportTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -lresolv' \
            CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER=NO \
            build | tee build.log

          APP="build/Build/Products/Release-iphoneos/WhiteListTransportTest.app"
          test -d "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry WhiteListTransportTest-unsigned.ipa Payload
          shasum -a 256 WhiteListTransportTest-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhiteListTransportTest-unsigned-ipa
          path: |
            WhiteListTransportTest-unsigned.ipa
            build.log
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WhiteListTransportTest-failed-build-log
          path: build.log
          if-no-files-found: ignore
