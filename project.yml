name: WhiteListTransportTest
options:
  bundleIdPrefix: com.whitelistvpn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "30"
    MARKETING_VERSION: "0.3.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WhiteListTransportTest:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitelistvpn.transporttest
        PRODUCT_NAME: WhiteListTransportTest
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Shared/WhiteList-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - framework: Frameworks/Mobile.xcframework
        embed: false
    scheme:
      testTargets: []
